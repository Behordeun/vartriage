site_name: vartriage
site_url: https://behordeun.github.io/vartriage/
site_description: Clinical variant triage for gene panels. VCF in, ACMG-classified report out.
site_author: Muhammad Abiodun SULAIMAN, Bolaji Fatai OYEYEMI
repo_url: https://github.com/Behordeun/vartriage
repo_name: Behordeun/vartriage
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 3

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guides:
      - ACMG Classification: acmg-criteria.md
      - API Mode: api-mode.md
      - Structural Variants: structural-variants.md
      - Mitochondrial Variants: mitochondrial.md
      - Gene-Disease Linkage: gene-disease-linkage.md
      - Cohort Analysis: cohort-analysis.md
      - Score Bundles: bundles.md
  - Reference:
      - Configuration: configuration.md
      - Pipeline Stages: pipeline-stages.md
      - Architecture: architecture.md
      - Reference Files: reference-files.md
      - Examples: examples.md
      - Tutorial: tutorial.md
  - API Reference:
      - Overview: api/index.md
      - Pipeline: api/pipeline.md
      - Parser: api/parser.md
      - Annotation: api/annotation.md
      - Filter: api/filter.md
      - Prioritization: api/prioritization.md
      - Classification: api/classification.md
      - Reporting: api/reporting.md
      - Cohort: api/cohort.md
      - Models: api/models.md
      - Config: api/config.md
      - Exceptions: api/exceptions.md
  - Development:
      - Contributing: contributing.md
      - Changelog: changelog.md
      - Validation: validation.md

not_in_nav: |
  /archives/**
  /examples/README.md
